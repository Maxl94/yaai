x-yaai-app: &yaai-app
  image: yaai-dev:local
  env_file:
    - .env
  environment: &yaai-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aimon}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-aimonitoring}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aimonitoring}
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimon} -d ${POSTGRES_DB:-aimonitoring}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot job: applies database migrations before the backend starts.
  # It owns the image build; the backend reuses the built image.
  migrate:
    <<: *yaai-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: [".venv/bin/python", "-m", "yaai.server.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *yaai-app
    pull_policy: never
    environment:
      <<: *yaai-env
      SCHEDULER_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs the scheduled drift jobs (and creates their notifications); serves no HTTP.
  worker:
    <<: *yaai-app
    pull_policy: never
    command: [".venv/bin/python", "-m", "yaai.server.worker"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
